
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KantongKu - Week 5</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .navbar-custom {
            background-color: #28527a;
        }

        .card {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/">&larr; KantongKu</a>
            <span class="navbar-text text-white">
                Praktikum Week 5
            </span>
        </div>
    </nav>

    <main class="container py-4">
        <h3>Manajemen Pengeluaran</h3>
        <p>Catat dan kelola pengeluaran harian mahasiswa.</p>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5>Ringkasan Pengeluaran</h5>
                        <p>Jumlah transaksi: <span id="jumlahData">0</span></p>
                        <p>Total pengeluaran: <strong id="totalPengeluaran">Rp0</strong></p>
                        <button id="btnToggle" class="btn btn-secondary btn-sm">
                            Sembunyikan/Tampilkan Ringkasan
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5>Tambah Pengeluaran</h5>

                        <form id="formPengeluaran">
                            <div class="mb-3">
                                <label for="nama" class="form-label">Nama pengeluaran</label>
                                <input type="text" id="nama" class="form-control"
                                    placeholder="Contoh: Makan siang" required>
                            </div>

                            <div class="mb-3">
                                <label for="kategori" class="form-label">Kategori</label>
                                <select id="kategori" class="form-select" required>
                                    <option value="">Pilih kategori</option>
                                    <option value="Makanan">Makanan</option>
                                    <option value="Transportasi">Transportasi</option>
                                    <option value="Jajan">Jajan</option>
                                    <option value="Kuliah">Keperluan kuliah</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="nominal" class="form-label">Nominal (Rp)</label>
                                <input type="number" id="nominal" class="form-control"
                                    min="1" placeholder="Contoh: 15000" required>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Tambah Data
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5>Daftar Pengeluaran</h5>

                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>No.</th>
                                <th>Nama</th>
                                <th>Kategori</th>
                                <th>Nominal</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="daftarPengeluaran"></tbody>
                    </table>
                </div>

                <p id="pesanKosong" class="text-muted">Belum ada data pengeluaran.</p>
            </div>
        </div>

        <a href="/" class="btn btn-outline-secondary btn-sm">
            Kembali ke Week 4
        </a>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/script.js"></script>
</body>
</html>
